[package]
name = "protocol"
version = "0.1.0"
description = "A stealth AI Copilot"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# Core Framework
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tauri Plugins
tauri-plugin-window-state = "2.0.0"
tauri-plugin-global-shortcut = "2"

screenshots = "0.8"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
base64 = "0.21"

rdev = "0.5"
tokio = { version = "1.35", features = ["full"] }
sysinfo = "0.30"
once_cell = "1.19"
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.6", features = ["v4"] }
sha2 = "0.10"
regex = "1.10"
wmi = "0.13"
rand = "=0.8.5"
tracing = "0.1.44"

# Object-safe async traits (VmManagerOps) and its mock surface.
async-trait = "0.1"

windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
] }

winapi = { version = "0.3.9", features = [
    "winuser",
    "winbase",
    "wingdi",
    "windef",
    "errhandlingapi",
    "dxgi",
    "dxgi1_2",
    "d3d11",
    "d3d11sdklayers",
    "shellapi",
    "processthreadsapi",
    "psapi",
    "winnt",
    "minwindef",
    "ntdef",
    "winerror",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Wmi",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
] }
windows-service = "0.6"
winreg = "0.52"

[dev-dependencies]
# `full` omits test-util, which #[tokio::test(start_paused = true)] requires.
tokio = { version = "1.35", features = ["full", "test-util"] }
mockall = "0.13"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
