[package]
name = "protocol"
version = "0.1.0"
description = "A stealth AI Copilot"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# Core Framework
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tauri Plugins
tauri-plugin-global-shortcut = "2.0.0" 
tauri-plugin-window-state = "2.0.0"

# 📸 NATIVE STEALTH CAPTURE CRATES
screenshots = "0.8"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
base64 = "0.21"

# 👇 The OS-Level Screen Capture Evasion Windows API 👇
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# 👇 Senior Systems Flex: Optimization for Stealth & Speed 👇
[profile.release]
opt-level = "s"       # Optimize for minimum binary size
lto = true            # Link-Time Optimization (runs faster, makes binary smaller)
codegen-units = 1     # Maximizes optimization (takes longer to compile, but runs better)
strip = true          # Strips debug symbols (makes reverse-engineering much harder)
panic = "abort"       # Instantly kills the process on panic (prevents memory leaks/exploit vectors)
