<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frames Gallery</title>
<style>
  :root { --bg: #0a0a0a; --fg: #ffd60a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    padding: 40px 24px 80px;
  }
  header {
    max-width: 1200px; margin: 0 auto 32px; padding-bottom: 24px;
    border-bottom: 2px solid var(--fg);
    display: flex; flex-wrap: wrap; gap: 16px;
    align-items: center; justify-content: space-between;
  }
  h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; }
  .sub { opacity: .65; font-size: .9rem; margin-top: 4px; }
  #dlAll {
    border: 2px solid var(--fg); cursor: pointer; font-size: 1rem; font-weight: 800;
    padding: 14px 28px; border-radius: 999px;
    background: var(--fg); color: var(--bg);
    transition: background .15s, color .15s, transform .15s;
  }
  #dlAll:hover:not(:disabled) { background: var(--bg); color: var(--fg); transform: translateY(-2px); }
  #dlAll:disabled { opacity: .4; cursor: not-allowed; }
  #bar { max-width: 1200px; margin: 0 auto 24px; height: 6px; border-radius: 6px;
         border: 1px solid var(--fg); overflow: hidden; display: none; }
  #bar div { height: 100%; width: 0; background: var(--fg); transition: width .2s; }
  #grid {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
  }
  .card {
    border: 2px solid var(--fg);
    border-radius: 16px; overflow: hidden;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 6px 6px 0 var(--fg); }
  .card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; cursor: zoom-in;
              background: var(--bg); border-bottom: 2px solid var(--fg); }
  .meta { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .meta b { display: block; font-size: .85rem; }
  .meta small { opacity: .6; font-size: .72rem; word-break: break-all; }
  .meta a {
    flex-shrink: 0; text-decoration: none; font-size: .8rem; font-weight: 800;
    padding: 8px 14px; border-radius: 999px; border: 2px solid var(--fg);
    color: var(--fg); background: var(--bg);
    transition: background .15s, color .15s;
  }
  .meta a:hover { background: var(--fg); color: var(--bg); }
  #msg { text-align: center; opacity: .7; padding: 60px 0; }
  #lb {
    position: fixed; inset: 0; background: var(--bg); display: none;
    align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; padding: 24px;
  }
  #lb img { max-width: 100%; max-height: 100%; border-radius: 12px; border: 2px solid var(--fg); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Frames Gallery</h1>
    <div class="sub" id="count">Loading...</div>
  </div>
  <button id="dlAll" disabled>Download all</button>
</header>
<div id="bar"><div></div></div>
<div id="grid"></div>
<div id="msg" style="display:none"></div>
<div id="lb"><img alt=""></div>

<script>
const SB_URL = 'https://yfyiizovbhsddpmgduvs.supabase.co';
const SB_KEY = 'sb_publishable_NoyP-ECcNTrOdxc27CQdtw_9iopHIN9';
let allRows = [];

const $ = id => document.getElementById(id);
const showMsg = t => { $('msg').style.display = 'block'; $('msg').textContent = t; };

fetch(`${SB_URL}/rest/v1/copilot_sessions?select=id,batch_id,session_code,image_url&image_url=not.is.null&order=id`, {
  headers: { apikey: SB_KEY }
})
.then(r => r.json())
.then(rows => {
  if (!Array.isArray(rows)) { $('count').textContent = 'Error'; return showMsg('Error: ' + JSON.stringify(rows)); }
  allRows = rows;
  $('count').textContent = `${rows.length} image${rows.length === 1 ? '' : 's'} found`;
  if (!rows.length) return showMsg('No images found');
  $('dlAll').disabled = false;
  $('dlAll').textContent = `Download all (${rows.length})`;
  $('grid').innerHTML = rows.map((r, i) => `
    <div class="card">
      <img src="${r.image_url}" data-i="${i}" loading="lazy" alt="frame ${r.id}">
      <div class="meta">
        <div><b>#${r.id} &middot; ${r.session_code || ''}</b><small>${r.batch_id}</small></div>
        <a download="${r.id}_${r.batch_id}.jpg" href="${r.image_url}">Download</a>
      </div>
    </div>`).join('');
})
.catch(e => { $('count').textContent = 'Failed'; showMsg('Failed: ' + e); });

// click image to enlarge
$('grid').addEventListener('click', e => {
  if (e.target.tagName === 'IMG') {
    $('lb').querySelector('img').src = allRows[e.target.dataset.i].image_url;
    $('lb').style.display = 'flex';
  }
});
$('lb').onclick = () => $('lb').style.display = 'none';
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('lb').style.display = 'none'; });

// download all
$('dlAll').onclick = async () => {
  const btn = $('dlAll'), bar = $('bar'), fill = bar.firstElementChild;
  btn.disabled = true; bar.style.display = 'block';
  for (let i = 0; i < allRows.length; i++) {
    const r = allRows[i];
    const a = document.createElement('a');
    a.href = r.image_url;
    a.download = `${r.id}_${r.batch_id}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
    fill.style.width = ((i + 1) / allRows.length * 100) + '%';
    btn.textContent = `Downloading ${i + 1}/${allRows.length}...`;
    await new Promise(res => setTimeout(res, 400));
  }
  btn.textContent = 'Done!';
  setTimeout(() => {
    btn.disabled = false; btn.textContent = `Download all (${allRows.length})`;
    bar.style.display = 'none'; fill.style.width = '0';
  }, 2500);
};
</script>
</body>
</html>
